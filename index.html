<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我們家的小金庫</title>
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#ff9eb5"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="小金庫">
<style>
:root{--bg:#fff6ef;--card:#ffffff;--tx:#5a4040;--sub:#a38a85;--pk:#ff9eb5;--pk2:#ffe1e8;--mt:#9bd8c0;--mt2:#e0f5ec;--yl:#ffd98a;--ln:#f3dcd2;--bad:#f08a8a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2b2224;--card:#3a2e31;--tx:#fbeae6;--sub:#c4aaa5;--pk2:#5a3a44;--mt2:#2f4a41;--ln:#54444a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#2b2224;--card:#3a2e31;--tx:#fbeae6;--sub:#c4aaa5;--pk2:#5a3a44;--mt2:#2f4a41;--ln:#54444a;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;max-width:560px;margin:0 auto;padding:12px 14px 90px}
h1{font-size:21px;margin:6px 0 10px;text-align:center}
.card{background:var(--card);border-radius:20px;padding:14px;margin:10px 0;box-shadow:0 3px 0 var(--ln)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.chip{border:2px solid var(--ln);background:var(--card);color:var(--tx);border-radius:99px;padding:6px 14px;font-size:15px;cursor:pointer;font-family:inherit}
.chip.on{background:var(--pk2);border-color:var(--pk);font-weight:700}
.btn{background:var(--pk);color:#fff;border:0;border-radius:14px;padding:10px 16px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.btn.g{background:var(--mt)}.btn.s{background:transparent;color:var(--sub);border:1px solid var(--ln);padding:4px 10px;font-size:13px;font-weight:400}
input,select{border:2px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:12px;padding:8px 10px;font-size:15px;font-family:inherit;min-width:0;flex:1 1 90px}
.big{font-size:26px;font-weight:800}.sub{color:var(--sub);font-size:13px}
.in{color:#4bb391}.out{color:var(--bad)}
.li{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px dashed var(--ln);align-items:center}.li:last-child{border:0}
.tag{font-size:11px;background:var(--yl);color:#6b4f1a;border-radius:8px;padding:1px 6px;margin-left:4px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--ln);display:flex;justify-content:center;gap:4px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;max-width:120px;border:0;background:none;color:var(--sub);font-size:12px;font-family:inherit;cursor:pointer;padding:4px;border-radius:12px}
nav button.on{background:var(--pk2);color:var(--tx);font-weight:700}nav span{display:block;font-size:20px}
.tip{background:var(--mt2);border-radius:14px;padding:10px 12px;margin:8px 0;font-size:14px;line-height:1.55}
.bar{height:10px;border-radius:9px;background:var(--ln);overflow:hidden}.bar i{display:block;height:100%;background:var(--pk)}
</style>
</head>
<body>
<h1 id="hd"></h1>
<div id="app"></div>
<nav id="nav"></nav>
<script>
const EC=['🍚 餐飲','🛒 生活用品','🚌 交通','🏠 房租房貸','📱 電話費','🌐 網路費','⚡ 水電瓦斯','🛡️ 保險費','👶 育兒教育','🎈 娛樂','🏥 醫療','🎁 其他'],IC=['💰 月薪','📈 股利','🧧 其他收入'];
const now=new Date(),cy=now.getFullYear(),cm=now.getMonth()+1,td=now.getDate();
const pad=n=>String(n).padStart(2,'0'),ym=(y,m)=>y+'-'+pad(m),uid=()=>Math.random().toString(36).slice(2,9),dim=(y,m)=>new Date(y,m,0).getDate();
const $=s=>document.querySelector(s),$$=n=>'$'+Math.round(n).toLocaleString(),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let db=null,ID=null,F=[],P=[],M={},A={},rd={f:0,p:0,m:0,a:0},msg='',tab='home',vy=cy,vm=cm,busy=0,lastAgg='',fail=0;
const col=()=>db.collection('fam');
const ds=s=>s.docs.map(d=>({id:d.id,...d.data()}));
const all=k=>[...F,...P].filter(x=>x.k===k);
const ok=()=>rd.f&&rd.p&&rd.m&&rd.a;
async function w(fn){try{await fn()}catch(e){msg='儲存失敗：'+(e&&e.message||e.code||'請確認你有編輯權限')}render()}
const DEF='https://script.google.com/macros/s/AKfycby8oUx71raC0vj4ovqPO2tqOpSpfR5_5Nzzy8MLJuu8Uq1BZZhSaWrMFNyDMwwPXT8S5Q/exec';let API=DEF;
let CRED=null,subs={},cache={},timer=0,loginErr='';
async function call(op,x){const r=await fetch(API,{method:'POST',body:JSON.stringify({...CRED,op,...x})});const j=await r.json();if(j.err)throw{code:j.err,message:j.err};return j}
const snapOf=p=>({docs:Object.entries(cache[p]||{}).map(([id,d])=>({id,data:()=>d}))});
function notify(){for(const p in subs)if(cache[p])subs[p].forEach(f=>f[0](snapOf(p)))}
let lastSync='';async function pull(){const j=await call('sync',{}),h=JSON.stringify(j.c);if(h===lastSync)return;lastSync=h;cache=j.c;notify()}
function dref(c,id){const wr=async(o,d)=>{const t=cache[c]||(cache[c]={});if(o=='set')t[id]=d;else if(o=='update')t[id]={...(t[id]||{}),...d};else delete t[id];notify();try{await call('w',{o,c,id,d})}catch(e){await pull().catch(()=>{});throw e}};return{set:d=>wr('set',d),update:d=>wr('update',d),delete:()=>wr('del')}}
const DB={collection:p=>({doc:id=>dref(p,id),onSnapshot(n,e){(subs[p]=subs[p]||[]).push([n,e]);return()=>{}}}),doc:p=>{const i=p.lastIndexOf('/');return dref(p.slice(0,i),p.slice(i+1))}};
const rnd=n=>{const a=new Uint8Array(n);crypto.getRandomValues(a);return[...a].map(x=>x.toString(16).padStart(2,'0')).join('')};
function pick(id){ID=id;try{localStorage.setItem('me',id)}catch(e){}render()}
async function init(){$('#hd').innerHTML=ico('av:dad',46)+' 我們家的小金庫 '+ico('av:mom',46);CRED={};try{ID=localStorage.getItem('me')}catch(e){}render();start()}
async function start(){
 if(API.startsWith('貼上')){msg='尚未設定後端網址，請見部署教學';render();return}
 db=DB;subs={};cache={};rd={f:0,p:1,m:0,a:1};const er=()=>{msg='連線錯誤';render()};
 db.collection('fam').onSnapshot(x=>{F=ds(x);rd.f=1;sync()},er);
 db.collection('members').onSnapshot(x=>{M={};x.docs.forEach(d=>M[d.id]=d.data());rd.m=1;render()},er);
 render();
 try{await pull()}catch(e){if(e&&e.code=='bad'){msg='這個小金庫已綁定其他家庭，請向家人索取正確的連結';render();return}msg='連線失敗，請檢查網路或後端網址，稍後自動重試';render();setTimeout(start,10000);return}
 clearInterval(timer);timer=setInterval(()=>{if(document.visibilityState=='visible')pull().catch(()=>{})},20000);
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState=='visible')pull().catch(()=>{})})}
function sync(){render();gen();aggSync()}
async function aggSync(){return;const m={};P.filter(x=>x.k=='tx').forEach(x=>{const k=x.d.slice(0,7),r=m[k]||(m[k]={i:0,o:0,f:0});if(x.t=='in')r.i+=x.a;else{r.o+=x.a;if(x.auto)r.f+=x.a}});const j=JSON.stringify(m);if(j===lastAgg)return;lastAgg=j;try{await db.doc('agg/'+ID).set({m})}catch(e){lastAgg=''}}
async function gen(){
 if(busy||!rd.f||!rd.p)return;busy=1;
 try{for(const x of [...F,...P]){
  if(x.k!='rec'&&x.k!='st')continue;
  const c=col(x.p),isr=x.k=='rec',todo=[],last=x.last||'';let st=x.from;if(last){let[a,b]=last.split('-').map(Number);if(++b>12){b=1;a++}st=ym(a,b)}
  let[y,m]=st.split('-').map(Number),done=last;
  while(y<cy||(y==cy&&m<=cm)){const k=ym(y,m),d=isr?Math.min(x.day,dim(y,m)):15;if(y==cy&&m==cm&&d>td)break;
   if(isr?(x.freq!='y'||m==x.mon):x.m.includes(m))todo.push(['x'+x.id+'_'+k,{k:'tx',d:k+'-'+pad(d),a:isr?x.a:x.sh*x.dps,t:isr?x.t:'in',c:isr?x.c:IC[1],o:ID,p:!!x.p,note:isr?x.name:x.name+' 股利',auto:1}]);
   done=k;if(++m>12){m=1;y++}}
  if(done!==last){for(const t of todo)await c.doc(t[0]).set(t[1]);await c.doc(x.id).update({last:done})}
 }}catch(e){msg='自動入帳失敗：'+(e&&e.message||'')}
 busy=0}
function tot(pre){const r={i:0,o:0,f:0};all('tx').forEach(x=>{if(x.d.startsWith(pre)){if(x.t=='in')r.i+=x.a;else{r.o+=x.a;if(x.auto)r.f+=x.a}}});
 for(const id in A){if(id===ID)continue;const m=A[id].m||{};for(const k in m)if(k.startsWith(pre)){r.i+=m[k].i;r.o+=m[k].o;r.f+=m[k].f}}return r}
const nm=id=>M[id]?ico(M[id].e,18)+' ':'👤 ';
function setTab(t){tab=t;render()}
function render(){
 $('#nav').innerHTML=[['home','🏠','首頁'],['fix','🔁','固定收支'],['year','📊','年度報告'],['set','⚙️','設定']].map(([k,i,n])=>`<button class="${tab==k?'on':''}" onclick="setTab('${k}')"><span>${i}</span>${n}</button>`).join('');
 let b='';
 if(!CRED)b=loginHtml();else if(fail)b=`<div class="card"><b>🔑 需要登入才能共用</b><p class="sub">請在 claude.ai 登入你的帳號開啟這個頁面。擁有者要把另一半邀請為「Contributor（可使用並變更資料）」以上，兩人才能看到同一份帳本。</p></div>`;
 else if(!ok())b=`<div class="card">🐾 小金庫載入中…<p class="sub">${esc(msg)}</p></div>`;
 else{
  const chips=Object.entries(M).map(([id,m])=>`<button class="chip ${id===ID?'on':''}" onclick="pick('${id}')">${ico(m.e,22)} ${esc(m.n)}${id===ID?'（我）':''}</button>`).join('');
  b=`<div class="row" style="justify-content:center">${chips}</div>`+(msg?`<div class="tip out">${esc(msg)} <button class="btn s" onclick="msg='';render()">知道了</button></div>`:'')+(!M[ID]?welcome():tab=='home'?home():tab=='fix'?fix():tab=='year'?year():set())}
 $('#app').innerHTML=b}
function welcome(){return `<div class="card"><b>👋 歡迎！先告訴大家你是誰</b><div class="row" style="margin-top:8px"><input id="me" value="🐻" style="flex:0 0 56px;text-align:center"><input id="mn" placeholder="你的暱稱，如：老公"></div>${picker()}<button class="btn" style="width:100%;margin-top:10px" onclick="saveMe()">進入小金庫</button></div>`}
function saveMe(){const n=$('#mn').value.trim();if(!n)return;if(!ID){ID=rnd(4);try{localStorage.setItem('me',ID)}catch(e){}}w(()=>db.doc('members/'+ID).set({n,e:$('#me').value||'🐻'}))}
function mshift(d){vm+=d;if(vm>12){vm=1;vy++}if(vm<1){vm=12;vy--}render()}
function home(){
 const p=ym(vy,vm),T=tot(p),list=all('tx').filter(x=>x.d.startsWith(p)).sort((a,b)=>b.d.localeCompare(a.d)),mine=list.filter(x=>x.o===ID);
 const s=(l,t)=>l.filter(x=>x.t==t).reduce((a,x)=>a+x.a,0),bal=T.i-T.o;
 return `<div class="card"><div class="row sp"><button class="btn s" onclick="mshift(-1)">◀</button><b>${vy} 年 ${vm} 月</b><button class="btn s" onclick="mshift(1)">▶</button></div>
 <div class="row sp" style="margin-top:10px"><div><div class="sub">👨‍👩‍👧 家庭結餘</div><div class="big ${bal<0?'out':'in'}">${$$(bal)}</div></div><div style="text-align:right"><div class="sub">收入 <span class="in">${$$(T.i)}</span></div><div class="sub">支出 <span class="out">${$$(T.o)}</span></div></div></div>
 <div class="sub" style="margin-top:8px">${nm(ID)}我的：收入 ${$$(s(mine,'in'))}　支出 ${$$(s(mine,'out'))}</div></div>
 <div class="card"><b>✏️ 記一筆</b>
 <div class="row" style="margin-top:8px"><select id="t" onchange="catOpt()"><option value="out">💸 支出</option><option value="in" ${vf.t=='in'?'selected':''}>💰 收入</option></select><input id="a" type="number" inputmode="decimal" placeholder="金額" value="${vf.a||''}"></div>
 <div class="row" style="margin-top:8px"><select id="c">${(vf.t=='in'?IC:EC).map(c=>`<option ${c==vf.c?'selected':''}>${c}</option>`).join('')}</select><input id="d" type="date" value="${vf.d||ym(cy,cm)+'-'+pad(td)}"></div>
 <div class="row" style="margin-top:8px"><input id="n" placeholder="備註（選填）" value="${esc(vf.n||'')}"></div>
 <button class="btn" style="width:100%;margin-top:10px" onclick="addTx()">記下來 🐾</button></div>
 ${budgetCard(list)}<div class="card"><b>📒 本月明細</b> <span class="sub">點一筆可修改金額或類別</span>
 ${list.length?list.map(x=>x.id===editId?editRow(x):`<div class="li" onclick="edit('${x.id}')" style="cursor:pointer"><div>${esc(x.c)}${x.auto?'<span class="tag">自動</span>':''}${x.p?'<span class="tag">🙈</span>':''}<div class="sub">${x.d.slice(5)} ${nm(x.o)}${esc(x.note||'')}</div></div><div class="${x.t}">${x.t=='in'?'+':'-'}${$$(x.a)}</div></div>`).join(''):'<div style="text-align:center">'+ico('av:rider',90)+'<p class="sub">還沒有紀錄，開始記第一筆吧 🌱</p></div>'}</div>`}
function budgetCard(list){
 const B=(all('budget')[0]||{}).m||{},sp={};let tt=0;list.forEach(x=>{if(x.t=='out'){sp[x.c]=(sp[x.c]||0)+x.a;tt+=x.a}});
 const cats=Object.keys(B),ex=EC.filter(c=>sp[c]&&!B[c]);
 const row=(c,b)=>{const s=sp[c]||0,r=b?s/b:0;return `<div style="margin:8px 0"><div class="row sp"><span>${esc(c)}</span><span class="sub">${$$(s)}${b?' / '+$$(b):''}</span></div><div class="bar"><i style="width:${b?Math.min(100,r*100):(tt?s/tt*100:0)}%;${r>1?'background:var(--bad)':!b?'background:var(--mt)':''}"></i></div>${r>1?`<div class="sub out">超支 ${$$(s-b)}！</div>`:r>.8?'<div class="sub">快用完囉，注意一下 🐾</div>':''}</div>`};
 return `<div class="card"><b>🎯 本月預算與花費分類</b>${cats.map(c=>row(c,B[c])).join('')}${ex.map(c=>row(c,0)).join('')}${!cats.length&&!ex.length?'<p class="sub">還沒有支出，記帳後這裡會顯示分類與預算進度。</p>':''}<div class="row" style="margin-top:8px"><select id="bc">${EC.map(c=>`<option>${c}</option>`).join('')}</select><input id="ba" type="number" placeholder="每月預算（0＝取消）"><button class="btn g" onclick="setBud()">設定</button></div><p class="sub">預算由兩人共用；分類只統計你看得到的明細。</p></div>`}
function setBud(){const a=parseFloat($('#ba').value);if(!(a>=0))return;const m={...((all('budget')[0]||{}).m||{})};if(a>0)m[$('#bc').value]=a;else delete m[$('#bc').value];w(()=>db.doc('fam/budget').set({k:'budget',m}))}
function trend(Y){const d=[];for(let m=1;m<=12;m++)d.push(tot(ym(Y,m)));const mx=Math.max(1,...d.map(t=>Math.max(t.i,t.o)));
 return `<div style="display:flex;gap:3px;margin-top:12px">${d.map((t,i)=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center"><div style="display:flex;align-items:flex-end;gap:1px;height:70px"><i style="width:5px;border-radius:3px;background:var(--mt);height:${t.i/mx*100}%"></i><i style="width:5px;border-radius:3px;background:var(--pk);height:${t.o/mx*100}%"></i></div><span class="sub" style="font-size:10px">${i+1}月</span></div>`).join('')}</div><div class="sub">🟢 每月收入　🌸 每月支出</div>`}
let vf={};
const AV={"dad": "<svg viewBox=\"0 0 100 100\" width=\"100%\" height=\"100%\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M18 100Q20 74 50 74Q80 74 82 100Z\" fill=\"#efe6d4\"/><path d=\"M30 78L72 100\" stroke=\"#2b2b33\" stroke-width=\"5\"/><rect x=\"43\" y=\"66\" width=\"14\" height=\"10\" rx=\"4\" fill=\"#f5cfa6\"/><circle cx=\"50\" cy=\"53\" r=\"21\" fill=\"#fbd9b5\"/><path d=\"M27 38Q27 12 50 12Q73 12 73 38Z\" fill=\"#2b2b33\"/><ellipse cx=\"50\" cy=\"38\" rx=\"33\" ry=\"6.5\" fill=\"#3a3a44\"/><circle cx=\"41\" cy=\"54\" r=\"6.5\" fill=\"#fff\" stroke=\"#444\" stroke-width=\"2\"/><circle cx=\"59\" cy=\"54\" r=\"6.5\" fill=\"#fff\" stroke=\"#444\" stroke-width=\"2\"/><path d=\"M47.5 54h5\" stroke=\"#444\" stroke-width=\"2\"/><circle cx=\"41\" cy=\"54\" r=\"2.2\" fill=\"#333\"/><circle cx=\"59\" cy=\"54\" r=\"2.2\" fill=\"#333\"/><path d=\"M43 65Q50 71 57 65\" stroke=\"#c0605a\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><circle cx=\"34\" cy=\"63\" r=\"3.5\" fill=\"#ffb3b3\" opacity=\".7\"/><circle cx=\"66\" cy=\"63\" r=\"3.5\" fill=\"#ffb3b3\" opacity=\".7\"/></svg>", "mom": "<svg viewBox=\"0 0 100 100\" width=\"100%\" height=\"100%\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M24 52Q22 18 50 16Q78 18 76 52L80 90Q64 94 62 72L38 72Q36 94 20 90Z\" fill=\"#2a2024\"/><path d=\"M16 100Q18 78 50 78Q82 78 84 100Z\" fill=\"#efe6d4\"/><circle cx=\"50\" cy=\"95\" r=\"9\" fill=\"#d23a45\"/><rect x=\"43\" y=\"66\" width=\"14\" height=\"10\" rx=\"4\" fill=\"#f5cfa6\"/><circle cx=\"50\" cy=\"53\" r=\"20\" fill=\"#fbd9b5\"/><path d=\"M29 50Q30 26 50 26Q70 26 71 50Q60 38 50 40Q40 38 29 50Z\" fill=\"#2a2024\"/><rect x=\"31\" y=\"47\" width=\"17\" height=\"11\" rx=\"5\" fill=\"#3b2f36\" stroke=\"#d9a441\" stroke-width=\"1.5\"/><rect x=\"52\" y=\"47\" width=\"17\" height=\"11\" rx=\"5\" fill=\"#3b2f36\" stroke=\"#d9a441\" stroke-width=\"1.5\"/><path d=\"M48 51h4\" stroke=\"#d9a441\" stroke-width=\"2\"/><path d=\"M41 63Q50 73 59 63Z\" fill=\"#fff\" stroke=\"#d6616f\" stroke-width=\"2\" stroke-linejoin=\"round\"/><circle cx=\"33\" cy=\"62\" r=\"3.5\" fill=\"#ffb3b3\" opacity=\".7\"/><circle cx=\"67\" cy=\"62\" r=\"3.5\" fill=\"#ffb3b3\" opacity=\".7\"/></svg>", "rider": "<svg viewBox=\"0 0 100 100\" width=\"100%\" height=\"100%\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"24\" cy=\"86\" r=\"11\" fill=\"none\" stroke=\"#555\" stroke-width=\"3\"/><circle cx=\"78\" cy=\"86\" r=\"11\" fill=\"none\" stroke=\"#555\" stroke-width=\"3\"/><path d=\"M24 86L44 68H64L78 86M44 68L50 86H24M62 68L58 56\" stroke=\"#8a8a8a\" stroke-width=\"3\" fill=\"none\"/><path d=\"M60 72Q82 64 92 80L72 80Z\" fill=\"#f6b21b\"/><path d=\"M34 62Q36 46 50 44Q64 46 66 62Z\" fill=\"#1d1d22\"/><path d=\"M62 50L70 60\" stroke=\"#1d1d22\" stroke-width=\"6\" stroke-linecap=\"round\"/><rect x=\"38\" y=\"60\" width=\"28\" height=\"13\" rx=\"5\" fill=\"#1f858c\"/><circle cx=\"46\" cy=\"66\" r=\"2\" fill=\"#f0e6d0\"/><circle cx=\"56\" cy=\"64\" r=\"2\" fill=\"#f0e6d0\"/><circle cx=\"62\" cy=\"68\" r=\"2\" fill=\"#f0e6d0\"/><rect x=\"48\" y=\"72\" width=\"6\" height=\"11\" fill=\"#f3c9a0\"/><rect x=\"46\" y=\"82\" width=\"11\" height=\"4\" rx=\"2\" fill=\"#8b5a2b\"/><circle cx=\"50\" cy=\"30\" r=\"17\" fill=\"#1d1d22\"/><circle cx=\"50\" cy=\"33\" r=\"11.5\" fill=\"#fbd9b5\"/><path d=\"M42 31Q45 28 48 31M53 31Q56 28 59 31\" stroke=\"#333\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M43 36Q50 46 57 36Z\" fill=\"#fff\" stroke=\"#c0605a\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/></svg>"};
function ico(e,z){const m=/^av:(\w+)$/.exec(e||'');return m&&AV[m[1]]?`<span style="display:inline-block;width:${z}px;height:${z}px;vertical-align:middle">${AV[m[1]]}</span>`:esc(e||'')}
function picker(){return `<div class="row" style="margin-top:8px"><span class="sub">卡通頭像：</span>${['dad','mom','rider'].map(k=>`<button class="chip" onclick="$('#me').value='av:${k}'">${ico('av:'+k,34)}</button>`).join('')}</div>`}
let editId=null,dp=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;render()});
function installApp(){if(dp){dp.prompt();dp=null;render()}}
function editRow(x){const L=x.t=='in'?IC:EC,o=L.includes(x.c)?L:[x.c,...L];return `<div style="background:var(--pk2);border-radius:14px;padding:10px;margin:6px 0"><div class="row"><input id="ea" type="number" inputmode="decimal" value="${x.a}"><select id="ec">${o.map(c=>`<option ${c==x.c?'selected':''}>${c}</option>`).join('')}</select></div><div class="row" style="margin-top:8px"><input id="ed" type="date" value="${x.d}"><input id="en" placeholder="備註" value="${esc(x.note||'')}"></div><div class="row" style="margin-top:8px"><button class="btn g" onclick="saveEdit('${x.id}')">儲存</button><button class="btn s" onclick="edit(null)">取消</button><button class="btn s" onclick="if(confirm('確定刪除這筆？'))delEdit('${x.id}')">🗑️ 刪除</button></div></div>`}
function edit(id){editId=id;render()}
function saveEdit(id){const a=parseFloat($('#ea').value);if(!(a>0))return;editId=null;w(()=>col().doc(id).update({a,c:$('#ec').value,d:$('#ed').value,note:$('#en').value}))}
function delEdit(id){editId=null;w(()=>col().doc(id).delete())}
function catOpt(){vf.t=$('#t').value;vf.c=null;$('#c').innerHTML=($('#t').value=='in'?IC:EC).map(c=>`<option>${c}</option>`).join('')}
function addTx(){const a=parseFloat($('#a').value);if(!(a>0))return;const p=false;vf={};w(()=>col(p).doc('t'+uid()).set({k:'tx',d:$('#d').value,a,t:$('#t').value,c:$('#c').value,o:ID,p,note:$('#n').value}))}
function del(id){const x=[...F,...P].find(y=>y.id===id);if(x)w(()=>col(x.p).doc(id).delete())}
function fix(){
 const rl=all('rec'),sl=all('st');
 return `<div class="card"><b>🔁 固定收支（自動入帳）</b><p class="sub">月薪、電話費、網路費、房貸可設「每月」；保險費、稅金、年費等可設「每年」，到期日開啟頁面時自動記帳。</p>
 <div class="row"><input id="rn" placeholder="名稱，如：月薪"><input id="ra" type="number" placeholder="金額"></div>
 <div class="row" style="margin-top:8px"><select id="rt" onchange="rcat()"><option value="in">💰 收入</option><option value="out">💸 支出</option></select><select id="rc">${IC.map(c=>`<option>${c}</option>`).join('')}</select></div>
 <div class="row" style="margin-top:8px"><select id="rq" onchange="$('#rm').style.display=this.value=='y'?'':'none'"><option value="m">每月</option><option value="y">每年</option></select><select id="rm" style="display:none">${[...Array(12)].map((_,i)=>`<option value="${i+1}">${i+1} 月</option>`).join('')}</select><label class="sub">幾號</label><input id="rdy" type="number" min="1" max="31" value="5"></div><div class="row" style="margin-top:8px"><label class="sub">起始月</label><input id="rf" type="month" value="${ym(cy,cm)}"></div>
 
 <button class="btn g" style="width:100%;margin-top:8px" onclick="addRec()">新增固定項目</button>
 ${rl.map(r=>`<div class="li"><div>${esc(r.c)} ${esc(r.name)}${r.p?'<span class="tag">🙈</span>':''}<div class="sub">${nm(r.o)}${r.freq=='y'?'每年 '+r.mon+' 月 '+r.day+' 號':'每月 '+r.day+' 號'}・自 ${r.from} 起</div></div><div class="${r.t}">${$$(r.a)} ${r.o===ID?`<button class="btn s" onclick="del('${r.id}')">✕</button>`:''}</div></div>`).join('')}</div>
 <div class="card"><b>📈 股票股利</b><p class="sub">輸入股數與每次每股股利，配息月份自動入帳；領到後可修正每股實際金額。（網頁無法連線抓股利資料，需手動更新每股金額）</p>
 <div class="row"><input id="sn" placeholder="股票，如：0056"><input id="ss" type="number" placeholder="股數"><input id="sd" type="number" step="0.01" placeholder="每次每股股利"></div>
 <div class="row" style="margin-top:8px"><input id="sm" placeholder="配息月份，如：1,4,7,10"></div>
 <button class="btn g" style="width:100%;margin-top:8px" onclick="addSt()">新增持股</button>
 ${sl.map(s=>`<div class="li"><div>📈 ${esc(s.name)}${s.p?'<span class="tag">🙈</span>':''}<div class="sub">${nm(s.o)}${s.sh} 股・${s.m.join(',')} 月配息・約 ${$$(s.sh*s.dps)}/次</div></div>${s.o===ID?`<div class="row" style="flex:0 0 auto;flex-wrap:nowrap"><input id="e${s.id}" type="number" step="0.01" value="${s.dps}" style="width:70px;flex:none"><button class="btn s" onclick="editSt('${s.id}')">更新</button><button class="btn s" onclick="del('${s.id}')">✕</button></div>`:''}</div>`).join('')}</div>`}
function rcat(){$('#rc').innerHTML=($('#rt').value=='in'?IC:EC).map(c=>`<option>${c}</option>`).join('')}
function addRec(){const a=parseFloat($('#ra').value),n=$('#rn').value.trim();if(!(a>0)||!n)return;const p=false;w(()=>col(p).doc('r'+uid()).set({k:'rec',name:n,a,t:$('#rt').value,c:$('#rc').value,day:Math.min(31,Math.max(1,+$('#rdy').value||1)),from:$('#rf').value||ym(cy,cm),freq:$('#rq').value,mon:+$('#rm').value||1,o:ID,p,last:''}))}
function addSt(){const sh=+$('#ss').value,dps=+$('#sd').value,m=$('#sm').value.split(/[,，\s]+/).map(Number).filter(x=>x>=1&&x<=12),n=$('#sn').value.trim(),p=false;if(!n||!(sh>0)||!(dps>=0)||!m.length)return;w(()=>col(p).doc('s'+uid()).set({k:'st',name:n,sh,dps,m,from:ym(cy,cm),o:ID,p,last:''}))}
function editSt(id){const s=[...F,...P].find(x=>x.id===id),v=parseFloat($('#e'+id).value);if(s&&v>=0)w(()=>col(s.p).doc(id).update({dps:v}))}
function report(Y){
 const T=tot(String(Y)),R={inc:T.i,out:T.o,fixed:T.f,vr:T.o-T.f,cats:{},pi:0,po:0,pfix:0,pvar:0};
 all('tx').forEach(x=>{if(x.d.startsWith(Y)&&x.t=='out'&&!x.auto)R.cats[x.c]=(R.cats[x.c]||0)+x.a});
 if(Y==cy){
  all('rec').forEach(r=>{for(let m=1;m<=12;m++){const k=ym(Y,m);if(k<r.from||k<=(r.last||''))continue;if(r.freq=='y'&&m!=r.mon)continue;if(r.t=='in')R.pi+=r.a;else{R.po+=r.a;R.pfix+=r.a}}});
  all('st').forEach(s=>s.m.forEach(m=>{const k=ym(Y,m);if(k<s.from||k<=(s.last||''))return;R.pi+=s.sh*s.dps}));
  R.pvar=R.vr/cm*(12-cm);R.po+=R.pvar}
 R.PI=R.inc+R.pi;R.PO=R.out+R.po;R.bal=R.inc-R.out;R.PB=R.PI-R.PO;return R}
function yshift(d){vy+=d;render()}
function year(){
 const R=report(vy),rate=R.PI?R.PB/R.PI:0,mi=R.PI/12,vb=(R.vr+R.pvar)/12;
 const top=Object.entries(R.cats).sort((a,b)=>b[1]-a[1]).slice(0,3),ins=all('tx').filter(x=>x.d.startsWith(vy)&&x.c==EC[7]).reduce((a,x)=>a+x.a,0),dv=all('tx').filter(x=>x.d.startsWith(vy)&&x.c==IC[1]).reduce((a,x)=>a+x.a,0),tips=[];
 if(R.PI<=0)tips.push('目前還沒有足夠的收入資料，先設定月薪與固定項目，報告就會越來越準喔 🌱');
 else{
  tips.push(rate>=0.2?`🎉 預估儲蓄率 ${(rate*100).toFixed(0)}%，非常棒！明年可維持這個節奏。`:rate>=0.1?`🙂 預估儲蓄率 ${(rate*100).toFixed(0)}%，不錯，明年可以試著提高到 20%。`:`🌧️ 預估儲蓄率只有 ${(rate*100).toFixed(0)}%，明年建議先從「每月發薪日先存 10%」開始。`);
  tips.push(`🧸 緊急預備金建議準備 6 個月支出，約 ${$$(R.PO/12*6)}。`);
  tips.push(`💰 明年建議：每月存 ${$$(mi*Math.max(rate,0.2))}、日常變動花費控制在 ${$$(vb*0.95)} 以內（比今年少 5%）。`);
  if(top.length)tips.push(`📝 明年每月預算建議：${top.map(x=>x[0]+' '+$$(x[1]*0.95/(vy==cy?cm:12))).join('、')}（比今年少 5%），可到首頁設定預算。`);if(top.length)tips.push(`🔍 你看得到的明細中，花最多的是 ${top.map(x=>x[0]+'（'+$$(x[1])+'）').join('、')}，可以先從這幾項檢視。`);
  if(ins/R.PI>0.15)tips.push(`🛡️ 保險費佔收入 ${(ins/R.PI*100).toFixed(0)}%，超過常見的 15% 上限，建議檢視保單是否重複。`);
  else if(ins>0)tips.push(`🛡️ 保險費佔收入 ${(ins/R.PI*100).toFixed(0)}%，在合理範圍內。`);
  if(dv>0)tips.push(`📈 今年你看得到的股利入帳 ${$$(dv)}，建議單獨存起來或再投入，讓它越滾越大。`)}
 return `<div class="card"><div class="row sp"><button class="btn s" onclick="yshift(-1)">◀</button><b>🎄 ${vy} 年度家庭報告</b><button class="btn s" onclick="yshift(1)">▶</button></div>
 <div class="row sp" style="margin-top:10px"><div><div class="sub">目前實際結餘</div><div class="big ${R.bal<0?'out':'in'}">${$$(R.bal)}</div></div><div style="text-align:right"><div class="sub">${vy==cy?'年底預估結餘':'全年結餘'}</div><div class="big ${R.PB<0?'out':'in'}">${$$(R.PB)}</div></div></div>
 <div class="sub" style="margin-top:8px">全年收入${vy==cy?'（預估）':''} ${$$(R.PI)}　全年支出${vy==cy?'（預估）':''} ${$$(R.PO)}</div>
 ${trend(vy)}<div class="bar" style="margin-top:8px"><i style="width:${Math.min(100,R.PI?R.PO/R.PI*100:0)}%"></i></div><div class="sub">支出佔收入 ${R.PI?Math.round(R.PO/R.PI*100):0}%</div>
 ${vy==cy?'<p class="sub">預估＝已入帳 ＋ 尚未入帳的固定收支與股利 ＋ 今年平均每月日常花費 × 剩餘月份。</p>':''}</div>
 <div class="card"><b>🐻 明年的理財小建議</b>${tips.map(t=>`<div class="tip">${t}</div>`).join('')}</div>`}
function set(){const m=M[ID]||{n:'',e:'🐻'};
 return `<div class="card"><b>${nm(ID)}我的資料</b><div class="row" style="margin-top:8px"><input id="me" value="${esc(m.e)}" style="flex:0 0 56px;text-align:center"><input id="mn" value="${esc(m.n)}"></div>${picker()}<button class="btn" style="width:100%;margin-top:8px" onclick="saveMe()">儲存</button></div>
 <div class="card"><b>🔗 分享給家人</b><p class="sub">把這個網頁的網址傳給家人即可使用，不需要密碼或帳號。知道網址的人都能看到並修改所有帳目。</p><p class="sub">點頁面最上方的名字可以切換記帳人，例如共用同一支手機時。</p></div><div class="card"><b>📲 安裝成手機 App</b><p class="sub">${dp?'':'iPhone：用 Safari 開啟 → 分享 → 加入主畫面。安卓：用 Chrome 開啟 → ⋮ → 安裝應用程式。'}安裝後會有自己的圖示，開啟時是全螢幕。</p>${dp?'<button class="btn g" style="width:100%" onclick="installApp()">一鍵安裝到手機</button>':''}</div>`}
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
init();
</script></body></html>
